id: CHG-2026-024
title: Unify Pi backend SSE transport and run end-to-end acceptance
status: completed
created_at: 2026-08-03
purpose: >-
  Make the backend Pi call chain explicit and testable by sharing the SSE
  transport between both Pi endpoints, deduplicating terminal events, and
  propagating disconnect cancellation through the existing harness.
baseline:
  source: current disk state after CHG-2026-023
  evidence:
    - src/app/api/pi/route.ts
    - src/app/api/pi/source/route.ts
    - src/lib/pi/harness/coordinator.ts
scope:
  included:
    - Extract common Pi SSE start, error, terminal and cancellation handling.
    - Preserve authenticated route boundaries and existing event payload names.
    - Add a deterministic backend call-chain test covering run start, resource scheduling, live events, persisted replay and cancel.
    - Keep Git operations unlocked and avoid model/tool policy changes.
  excluded:
    - Frontend changes beyond the already completed reconnect behavior.
    - New external services or distributed queues.
    - Git-specific locking.
expected_files:
  - src/lib/pi/harness/transport.ts
  - src/app/api/pi/route.ts
  - src/app/api/pi/source/route.ts
  - tests/pi-backend-call-chain.test.ts
