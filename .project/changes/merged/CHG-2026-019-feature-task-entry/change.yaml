goals:
  - 让用户用一句自然语言表达创作意图，不再被迫先填写完整参数表
  - 以大纲和角色两个高频工具作为统一任务入口试点
  - 保留旧字段和高级设置，兼容现有 API、语义契约和文件树写入流程
  - 将事实、推断和可选偏好明确区分，避免模型静默覆盖已确认信息
  - 缺少非核心信息时继续生成，不把表单缺口当作默认阻塞条件
constraints:
  - 不改动 Pi 运行时与项目 API
  - 不改变文件树事实源和用户确认后写入原则
  - 不删除旧表单变量或旧接口字段
  - 不将推断内容直接写入 NovelData
