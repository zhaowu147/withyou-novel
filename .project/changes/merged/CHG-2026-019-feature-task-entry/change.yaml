implemented:
  - 新增大纲/角色自然语言任务入口文案与试点工具白名单
  - 大纲和角色模板增加 intent 字段，用户原话进入现有语义契约和生成提示
  - ToolPanel 默认只展示自然语言意图；旧字段收进高级设置，AI 补全按钮随高级设置保留
  - 大纲/角色前端缺少推荐资料时显示可继续提示，不再默认禁用生成
  - 服务端对大纲/角色同步放宽相同的工作流前置，避免前后端一边允许、一边返回 409
  - 试点不自动写入推断内容，仍须经过语义契约确认和原有保存动作
unresolved:
