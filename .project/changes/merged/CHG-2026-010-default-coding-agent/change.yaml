id: CHG-2026-010
title: Make Pi the default coding agent and remove the third permission tier
status: completed
created_at: 2026-08-01
baseline:
  source_of_truth: current disk code only; git history not used
  pi_ui: observer/project/source selector with source unlock flow
  pi_runtime: normal project runtime plus separately authorized source runtime
purpose: >-
  Make Pi identify as a coding agent by default. Remove the user-facing third
  permission tier and source unlock gate while preserving hard workspace,
  command, secret and proposal safety boundaries.
scope:
  - Make the default Pi route use the coding-agent runtime for the app workspace.
  - Remove source permission unlock, grant-token gating and three-level selector UI.
  - Keep soft identity guidance separate from hard execution policy.
  - Preserve existing proposal/review and environment installation flows.
