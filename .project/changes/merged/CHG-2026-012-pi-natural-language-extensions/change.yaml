deviations:
  - 未新增目录 REST API；Pi 的受控工具在服务器内直接调用目录适配器，避免把远程下载入口暴露为可被浏览器任意调用的公共接口。
implemented:
  - 默认 Pi 按工作区绑定的 novelId 创建隔离会话，提示词工具只能操作当前小说，避免跨工作区会话与提示词串线
  - 新增 prompt_list、prompt_read、prompt_save、prompt_activate、prompt_deactivate；内置提示词只读，自定义包可由 Pi 自然语言创建、修改和启停
  - 新增受限 Skill 目录搜索、下载安装、已安装列表、资源按需读取与启停工具
  - 未配置 SKILLS_SH_API_TOKEN 时，目录检索回退到 openai/skills 与 vercel-labs/skills 的公开 GitHub 文件树；配置令牌后可使用 skills.sh 搜索与文件树下载
  - Skill 安装记录文档资源的路径、字节数和哈希；资源只允许 Markdown、文本或结构化数据，单文件 64KB、总量 256KB，脚本和二进制不会下载或执行
  - API 手工导入同样支持受限资源包，启用与读取均会验证内容完整性
