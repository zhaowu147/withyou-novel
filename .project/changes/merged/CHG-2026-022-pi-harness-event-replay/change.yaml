  - src/app/api/pi/source/route.ts
  - tests/pi-harness.test.ts
validation_results:
  - Pi harness and journal tests: 4 passed, 0 failed
  - Biome check: passed
  - TypeScript noEmit: passed
  - Next.js production build: passed
decisions:
  - Git operations remain unlocked; no Git lock was added.
  - The current UI keeps its existing SSE behavior; automatic reconnect is exposed as an authenticated GET replay contract for a later client phase.
  - Journal I/O errors are logged and isolated from the active Pi stream.
