scope:
  included:
    - Emit an early runId and sequence-aware Pi events for live/replayed client deduplication.
    - Add bounded exponential polling recovery against the existing authenticated GET replay endpoint.
    - Centralize prompt input normalization and workspace resource scheduling in the Pi harness.
    - Keep Git operations unlocked and preserve existing tool-level safety checks.
  excluded:
    - A Git repository lock or Git-specific mutex.
    - Changes to model selection, tool permissions, or business API semantics.
    - Cross-machine distributed scheduling.
