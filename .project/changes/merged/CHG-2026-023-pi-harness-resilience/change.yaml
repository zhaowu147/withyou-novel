id: CHG-2026-023
title: Add Pi reconnect policy and workspace resource scheduling
status: completed
created_at: 2026-08-03
purpose: >-
  Complete the next Pi harness resilience layer: reconnect the existing dock to
  an interrupted SSE run, centralize common prompt scheduling policy, and
  serialize conflicting Pi work on the same workspace resource without adding
  a Git-specific lock.
