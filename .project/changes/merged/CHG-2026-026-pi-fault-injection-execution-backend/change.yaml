decisions:
  - SSE disconnect detaches by default so a dropped client can recover through the journal; explicit DELETE remains the user stop path.
  - Fault injection is an explicit transport seam and does not activate in production routes unless supplied by a caller.
  - PiExecutionBackend defaults to the system child-process implementation and can be replaced by an embedding host or deterministic test backend.
  - Shell command validation, environment secret redaction, Git intent gates and path boundaries remain above the backend boundary.
