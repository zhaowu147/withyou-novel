id: CHG-2026-026
title: Add Pi fault-injection acceptance and replaceable execution backend
status: completed
created_at: 2026-08-03
purpose: >-
  Close the remaining Pi resilience gaps by making fault injection and reconnect
  recovery executable acceptance paths, while moving shell, environment and Git
  process calls behind a replaceable backend with the existing system behavior
  as the default.
baseline:
  source: current disk state after CHG-2026-025
  evidence:
    - src/app/(main)/_components/pi-dock.tsx
    - src/lib/pi/coding-tools.ts
    - src/lib/pi/coding-environment.ts
    - src/lib/pi/source-proposal-store.ts
    - src/lib/pi/harness/transport.ts
    - tests/project-api-runtime.test.ts
scope:
  included:
    - Add deterministic fault-injection seams for transport and journal failure acceptance.
    - Add reconnect acceptance covering a dropped live stream, sequence replay and terminal completion.
    - Keep concurrent chapter write and checkpoint rollback acceptance explicit and in the full test command.
    - Define a replaceable PiExecutionBackend and migrate Shell, environment and Git process calls to it.
    - Preserve default system process behavior, path/command/secret safety and explicit Git user-intent gates.
  excluded:
    - New model providers or changes to Pi prompts and tool permissions.
    - Worker-thread or child-process AgentSession isolation.
    - Git-specific locking.
validation:
  - Targeted Pi fault/reconnect/backend acceptance tests
  - Existing project API concurrency and rollback acceptance
  - Full test suite, TypeScript, Biome and production build
