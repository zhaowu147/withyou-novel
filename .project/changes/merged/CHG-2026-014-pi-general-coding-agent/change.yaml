actual_scope_notes:
  - Pi now exposes environment status and prepare tools; preparation installs missing selected Windows runtimes, JavaScript dependencies, Python virtual environments and requirements.txt dependencies.
  - Pi supports common Node, Python, Java, .NET, Go, Rust and other development CLIs without an industry allowlist.
  - Arbitrary GitHub SKILL.md discovery, read and local installation are available through authenticated GitHub CLI; installation stores instructions only and never runs repository scripts.
  - Reversible source edits now apply immediately through the existing checkpoint and rollback store. Remote push, destructive commands and credential boundaries remain explicit hard limits.
  - This change deliberately does not connect Pi to novel or other project business APIs.
deviations:
